# Hand-authored TAB written in the example key A (root = G string fret 2).
# Box 5 of 5 (G-shape chord; roots on the G string fret 2 and both E
# strings fret 5). Sits one box below the root-position E shape and wraps
# the CAGED cycle.
id: major-pentatonic-g-shape
scale: major_pentatonic  # scale id from ../scales.yaml
name: "Major Pentatonic — G Shape"
caged_shape: G           # pentatonic category -> CAGED shape, not starting_finger
anchor: root_low_g       # root on the G string (fret 2 in A)
example_key: A
tab:
  E: [2, 5]
  A: [2, 4]
  D: [2, 4]
  G: [2, 4]
  B: [2, 5]
  e: [2, 5]
